services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: denard
      POSTGRES_PASSWORD: denard
      POSTGRES_DB: denard
    ports:
      - "55432:5432"
    volumes:
      - denard_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U denard -d denard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  denard_pg_data:
